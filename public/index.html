<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS DevSuite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/design-system.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body class="layout-login">
  <!-- ETAPA 13: Layout wireframe — barra superior + sidebar (layout-login se quita al mostrar nav) -->
  <div id="app-layout">
    <div class="nexus-sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
    <aside id="app-sidebar" aria-label="Navegación principal">
      <div class="nexus-sidebar-brand">
        <a href="#/dashboard" class="nexus-sidebar-logo" aria-label="Nexus DevSuite - Inicio">
          <img src="img/logo-navbar.png" alt="Nexus DevSuite" class="nexus-sidebar-logo-img">
        </a>
      </div>
      <nav class="nexus-sidebar-nav">
        <a class="nexus-sidebar-link" href="#/dashboard" data-view="dashboard">Panel</a>
        <a class="nexus-sidebar-link" href="#/projects" data-view="projects">Proyectos</a>
        <a class="nexus-sidebar-link" href="#/features" data-view="features">Features</a>
        <a class="nexus-sidebar-link" href="#/stories" data-view="stories">Stories</a>
        <a class="nexus-sidebar-link" href="#/sprints" data-view="sprints">Sprints</a>
        <a class="nexus-sidebar-link" href="#/releases" data-view="releases">Lanzamientos</a>
        <a class="nexus-sidebar-link" href="#/incidents" data-view="incidents">Incidentes</a>
        <a class="nexus-sidebar-link" href="#/documents" data-view="documents">Documentos</a>
        <a class="nexus-sidebar-link" id="nav-reports" href="#/reports" data-view="reports" style="display: none;">Reportes</a>
      </nav>
    </aside>
    <div id="app-main">
      <header id="app-topbar">
        <div class="nexus-topbar-left">
          <button type="button" class="btn btn-link btn-sm d-lg-none p-2 nexus-topbar-mobile-toggle" id="sidebar-toggle" aria-label="Abrir menú" aria-expanded="false"><span aria-hidden="true">☰</span></button>
          <a href="#/dashboard" class="nexus-topbar-brand" aria-label="Inicio Nexus DevSuite">
            <img src="img/nexus-logo.png" alt="" class="nexus-topbar-logo-icon" width="32" height="32">
            <span class="nexus-topbar-logo-text">Nexus DevSuite</span>
          </a>
        </div>
        <div class="nexus-topbar-center">
          <div class="nexus-topbar-search-wrap">
            <span class="nexus-topbar-search-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
            <input type="search" class="nexus-topbar-search form-control form-control-sm" placeholder="Buscar" aria-label="Buscar">
          </div>
        </div>
        <div class="nexus-topbar-actions">
          <button type="button" class="nexus-topbar-icon-btn" aria-label="Ayuda" title="Ayuda"><span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></span></button>
          <div class="dropdown">
            <button type="button" class="nexus-topbar-icon-btn dropdown-toggle" id="dropdownApps" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Aplicaciones" title="Aplicaciones"><span class="nexus-topbar-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span></button>
            <div class="dropdown-menu dropdown-menu-end nexus-apps-menu" aria-labelledby="dropdownApps">
              <div class="nexus-apps-menu-inner">
                <button type="button" class="nexus-apps-item" id="btn-new-project">
                  <span class="nexus-apps-item-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></span>
                  <span class="nexus-apps-item-label">Nuevo proyecto</span>
                </button>
                <a href="#/reports" class="nexus-apps-item">
                  <span class="nexus-apps-item-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span>
                  <span class="nexus-apps-item-label">Reportes</span>
                </a>
                <a href="#/projects" class="nexus-apps-item">
                  <span class="nexus-apps-item-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
                  <span class="nexus-apps-item-label">Proyectos</span>
                </a>
                <a href="#/admin/users" class="nexus-apps-item" id="nav-apps-users" style="display: none;">
                  <span class="nexus-apps-item-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                  <span class="nexus-apps-item-label">Usuarios</span>
                </a>
                <a href="#/admin/audit" class="nexus-apps-item" id="nav-apps-audit" style="display: none;">
                  <span class="nexus-apps-item-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg></span>
                  <span class="nexus-apps-item-label">Auditoría</span>
                </a>
                <a href="#/admin/metrics" class="nexus-apps-item" id="nav-apps-metrics" style="display: none;">
                  <span class="nexus-apps-item-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg></span>
                  <span class="nexus-apps-item-label">Métricas</span>
                </a>
              </div>
            </div>
          </div>
          <div class="dropdown">
            <button class="nexus-topbar-user-btn dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="nexus-topbar-avatar" id="nav-user-avatar"><span id="nav-user-initial">U</span></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li class="dropdown-header text-muted small" id="nav-user">Usuario</li>
              <li><hr class="dropdown-divider"></li>
              <li><button type="button" class="dropdown-item" id="btn-edit-current-user">Editar usuario</button></li>
              <li><button type="button" class="dropdown-item" id="btn-logout">Cerrar sesion</button></li>
            </ul>
          </div>
        </div>
      </header>
      <main class="nexus-main-content">
        <div id="content"></div>
      </main>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ux.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/features.js"></script>
  <script src="js/views/stories.js"></script>
  <script src="js/views/sprints.js"></script>
  <script src="js/views/releases.js"></script>
  <script src="js/views/incidents.js"></script>
  <script src="js/views/documents.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
