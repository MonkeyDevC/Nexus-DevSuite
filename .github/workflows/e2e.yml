name: E2E Playwright

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  e2e-button-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nexus_devsuite_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Raíz (API) + frontend-react tienen package-lock independientes (sin workspaces).
          cache-dependency-path: |
            package-lock.json
            frontend-react/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend-react

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for MySQL readiness
        env:
          MYSQL_PWD: root
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -u root --silent; then
              echo "MySQL is up"
              exit 0
            fi
            sleep 1
          done
          echo "MySQL did not start in time"
          exit 1

      - name: Bootstrap E2E (SSOT)
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: nexus_devsuite_test
          JWT_ACCESS_SECRET: ci_access_secret
          JWT_REFRESH_SECRET: ci_refresh_secret
          MASTER_PASSWORD: Master123!
          CORS_ALLOWED_ORIGINS: "*"
        run: npm run e2e:bootstrap

      - name: Run E2E tests
        env:
          CI: true
          FRONTEND_URL: http://127.0.0.1:3000
          NODE_ENV: test
          PORT: 3000
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: nexus_devsuite_test
          JWT_ACCESS_SECRET: ci_access_secret
          JWT_REFRESH_SECRET: ci_refresh_secret
          MASTER_PASSWORD: Master123!
          CORS_ALLOWED_ORIGINS: "*"
        run: npm run test:e2e

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-buttons
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
